<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>辩论 AI 二辩 · M1–M3</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --text:#e2e8f0; --muted:#94a3b8; --brand:#a52a2a; --brand2:#2563eb;
    --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.6;font-size:15px}
  header{padding:18px 22px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:700}
  header .tag{font-size:12px;color:var(--muted);border:1px solid var(--line);
    padding:2px 8px;border-radius:999px}
  main{max-width:1100px;margin:0 auto;padding:20px;display:grid;
    grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:880px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h2{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:600;
    letter-spacing:.04em;text-transform:uppercase}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input,textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);
    color:var(--text);border-radius:8px;padding:10px;font:inherit;font-size:14px}
  textarea{resize:vertical;min-height:90px}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .inline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:10px}
  .inline input[type=checkbox]{width:auto}
  button{cursor:pointer;border:none;border-radius:9px;padding:11px 16px;font:inherit;
    font-weight:600;font-size:14px;transition:.15s}
  .btn-main{background:var(--brand);color:#fff;width:100%;margin-top:14px}
  .btn-main:disabled{opacity:.5;cursor:not-allowed}
  .btn-stop{background:#422;color:#fca5a5;border:1px solid #7f1d1d}
  .stages{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .chip{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);
    color:var(--muted)}
  .chip.done{border-color:var(--ok);color:var(--ok)}
  .chip.run{border-color:var(--brand2);color:#93c5fd;animation:pulse 1.1s infinite}
  @keyframes pulse{50%{opacity:.45}}
  .sentence{background:var(--panel2);border-left:3px solid var(--brand2);
    border-radius:6px;padding:8px 11px;margin:6px 0;font-size:15px;
    animation:fade .25s ease}
  .sentence.speaking{border-left-color:var(--ok);background:#1c2b40}
  @keyframes fade{from{opacity:0;transform:translateY(3px)}}
  .flag{color:#fca5a5;font-size:13px;margin:5px 0;padding:6px 10px;
    background:#3f1d1d;border-radius:6px}
  .warn{color:#fcd34d;font-size:13px}
  .kv{font-size:13px;color:var(--muted);margin:4px 0}
  .kv b{color:var(--text);font-weight:600}
  .block{background:var(--panel2);border-radius:8px;padding:10px;font-size:13px;
    color:var(--muted);margin-top:8px;white-space:pre-wrap;max-height:220px;overflow:auto}
  .metrics{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13px}
  .metrics b{color:var(--ok)}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .speakbar{display:flex;align-items:center;gap:10px;margin-top:12px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
</style>
</head>
<body>
<header>
  <h1>辩论 AI 二辩</h1>
  <span class="tag">M1 出稿</span>
  <span class="tag">M2 语音亲述</span>
  <span class="tag">M3 提速</span>
  <span class="tag" id="engineTag">引擎检测中…</span>
</header>

<main>
  <section class="card">
    <h2>输入</h2>
    <label>辩题</label>
    <input id="topic" value="人工智能的发展对人的作用与意义是积极还是消极">
    <label>对方立论（一辩原文 / 人工转写）</label>
    <textarea id="opponent" placeholder="粘贴对方一辩立论原文…"></textarea>
    <div class="row">
      <div>
        <label>我方立场</label>
        <input id="side" placeholder="积极 / 消极">
      </div>
      <div>
        <label>目标时长（秒，30–60）</label>
        <input id="duration" type="number" value="45" min="30" max="60">
      </div>
    </div>
    <label>我方立论</label>
    <textarea id="ourCase" placeholder="粘贴我方立论要点…"></textarea>

    <div class="row" style="margin-top:12px">
      <div>
        <label>出稿模型</label>
        <select id="genModel"></select>
      </div>
      <div>
        <label>音色</label>
        <select id="voice"></select>
      </div>
      <div>
        <label>语速</label>
        <select id="rate">
          <option value="+0%">1.00×</option>
          <option value="+8%" selected>1.08×</option>
          <option value="+15%">1.15×</option>
          <option value="-8%">0.92×</option>
        </select>
      </div>
    </div>
    <div class="inline">
      <input type="checkbox" id="autoSpeak" checked>
      <label for="autoSpeak" style="margin:0">出句即播（边说边写）</label>
    </div>
    <div class="inline">
      <input type="checkbox" id="useToken">
      <label for="useToken" style="margin:0">使用访问口令</label>
      <input id="token" placeholder="口令" style="max-width:160px">
    </div>

    <button class="btn-main" id="runBtn">生成并播报</button>
    <div class="speakbar">
      <span class="dot" id="speakDot"></span>
      <span id="speakState" class="kv">待命</span>
      <button class="btn-stop" id="stopBtn" style="margin-left:auto">叫停</button>
    </div>
  </section>

  <section class="card">
    <h2>输出</h2>
    <div class="stages" id="stages"></div>
    <div id="structured" class="block" style="display:none"></div>
    <div id="planBlock" class="block" style="display:none"></div>
    <div id="speech" style="margin-top:10px"></div>
    <div id="flags" style="margin-top:8px"></div>
    <div class="metrics" id="metrics"></div>
    <div class="hint">播报为逐句在线合成（edge-tts），可随时叫停；生成与语音均经服务端转发，浏览器不直连模型。</div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const STAGES = ["draft", "outline", "guard"];
const STAGE_CN = {draft: "驳论生成", outline: "结构+策略", guard: "安全护栏"};

let abortCtrl = null;
let queue = [];
let playing = false;
let stopped = false;
let curAudio = null;
let sentenceEls = [];

function tokenHeader() {
  if ($("useToken").checked && $("token").value.trim()) {
    return {"x-debate-token": $("token").value.trim()};
  }
  return {};
}

function setStage(name, status) {
  let el = document.querySelector(`.chip[data-s="${name}"]`);
  if (!el) {
    el = document.createElement("span");
    el.className = "chip";
    el.dataset.s = name;
    el.textContent = STAGE_CN[name] || name;
    $("stages").appendChild(el);
  }
  el.className = "chip " + (status === "done" ? "done" : "run");
}

/* ---------- 语音队列（串行播放，可叫停） ---------- */
function setSpeakState(text, on) {
  $("speakState").textContent = text;
  $("speakDot").className = "dot" + (on ? " on" : "");
}
function enqueue(text, el) {
  queue.push({text, el});
  if (!playing) drain();
}
let onlineTtsOk = true;
async function drain() {
  playing = true;
  while (queue.length && !stopped) {
    const item = queue.shift();
    if (item.el) item.el.classList.add("speaking");
    let ok = false;
    if (onlineTtsOk) {
      try {
        const resp = await fetch("./api/tts", {
          method: "POST",
          headers: {"Content-Type": "application/json", ...tokenHeader()},
          body: JSON.stringify({text: item.text, voice: $("voice").value, rate: $("rate").value}),
        });
        if (resp.ok && !stopped) {
          setSpeakState("播报中（在线合成）：" + item.text.slice(0, 12) + "…", true);
          await playBlob(await resp.blob());
          ok = true;
        } else if (resp.status === 502 || resp.status === 503) {
          onlineTtsOk = false; /* 在线合成不可用，后续直接走本机 */
        }
      } catch (e) { onlineTtsOk = false; }
    }
    if (!ok && !stopped) {
      setSpeakState("播报中（本机语音）：" + item.text.slice(0, 12) + "…", true);
      await speakLocal(item.text);
    }
    if (item.el) item.el.classList.remove("speaking");
  }
  playing = false;
  if (!stopped) setSpeakState("播报完成", false);
}
function speakLocal(text) {
  return new Promise((resolve) => {
    if (!("speechSynthesis" in window)) { resolve(); return; }
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-CN";
      const r = parseFloat(($("rate").value || "+8%").replace(/[+%]/g, "")) || 0;
      u.rate = Math.min(2, Math.max(0.5, 1 + r / 100));
      u.onend = resolve;
      u.onerror = resolve;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    } catch (e) { resolve(); }
  });
}
function playBlob(blob) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(blob);
    curAudio = new Audio(url);
    const done = () => { URL.revokeObjectURL(url); curAudio = null; resolve(); };
    curAudio.onended = done;
    curAudio.onerror = done;
    curAudio.play().catch(done);
  });
}
function stopSpeak() {
  stopped = true;
  queue = [];
  if (curAudio) { try { curAudio.pause(); } catch (e) {} curAudio = null; }
  if (abortCtrl) { try { abortCtrl.abort(); } catch (e) {} }
  setSpeakState("已叫停", false);
}

/* ---------- SSE 事件处理 ---------- */
function handleEvent(ev) {
  if (ev.type === "stage") {
    setStage(ev.stage, ev.status);
  } else if (ev.type === "structured") {
    $("structured").style.display = "block";
    $("structured").textContent = "【结构化】\n" + JSON.stringify(ev.data, null, 2);
  } else if (ev.type === "plan") {
    $("planBlock").style.display = "block";
    $("planBlock").textContent = "【策略】\n" + ev.data.map(
      p => `${p.target} · ${p.angle}｜${p.line}`).join("\n");
  } else if (ev.type === "sentence") {
    const el = document.createElement("div");
    el.className = "sentence";
    el.textContent = (ev.idx) + ". " + ev.text;
    $("speech").appendChild(el);
    sentenceEls.push(el);
    if ($("autoSpeak").checked && !stopped) enqueue(ev.text, el);
  } else if (ev.type === "flag") {
    const el = document.createElement("div");
    el.className = "flag";
    el.textContent = "⚠ " + ev.text;
    $("flags").appendChild(el);
  } else if (ev.type === "warn") {
    const el = document.createElement("div");
    el.className = "warn";
    el.textContent = "· " + ev.text;
    $("flags").appendChild(el);
  } else if (ev.type === "done") {
    const m = ev.meta || {};
    $("metrics").innerHTML =
      `<span>首句延迟 <b>${m.first_sentence_ms ?? "-"} ms</b></span>` +
      `<span>总耗时 <b>${ev.elapsed} s</b></span>` +
      `<span>并行路数 <b>${m.parallel ?? "-"}</b></span>` +
      `<span>字数 <b>${m.chars ?? "-"}</b></span>` +
      (ev.flags && ev.flags.length ? `<span style="color:#fcd34d">警示 ${ev.flags.length} 条</span>` : `<span style="color:var(--ok)">无护栏警示</span>`);
    if (!ev.sentences || !ev.sentences.length) {
      const el = document.createElement("div");
      el.className = "flag";
      el.textContent = "没有可安全使用的句子，请人工接管。";
      $("flags").appendChild(el);
    }
    finish();
  } else if (ev.type === "error") {
    const el = document.createElement("div");
    el.className = "flag";
    el.textContent = "✗ " + ev.error;
    $("flags").appendChild(el);
    finish();
  }
}

function finish() {
  $("runBtn").disabled = false;
  $("runBtn").textContent = "生成并播报";
}

/* ---------- 主流程 ---------- */
async function run() {
  const opponent = $("opponent").value.trim();
  const side = $("side").value.trim();
  const ourCase = $("ourCase").value.trim();
  if (!opponent || !side || !ourCase) { alert("请填写对方立论、我方立场、我方立论"); return; }

  stopped = false;
  queue = []; playing = false; sentenceEls = [];
  $("speech").innerHTML = ""; $("flags").innerHTML = ""; $("metrics").innerHTML = "";
  $("structured").style.display = "none"; $("planBlock").style.display = "none";
  $("stages").innerHTML = "";
  $("runBtn").disabled = true;
  $("runBtn").textContent = "生成中…";
  setSpeakState($("autoSpeak").checked ? "等待首句…" : "（未开启自动播报）", false);
  STAGES.forEach(s => setStage(s, "start"));

  abortCtrl = new AbortController();
  try {
    const resp = await fetch("./api/rebut", {
      method: "POST",
      headers: {"Content-Type": "application/json", ...tokenHeader()},
      body: JSON.stringify({
        opponent, our_side: side, our_case: ourCase,
        topic: $("topic").value.trim(), duration: parseInt($("duration").value) || 45,
        model: ($("genModel") && $("genModel").value) || "",
      }),
      signal: abortCtrl.signal,
    });
    if (!resp.ok) {
      let detail = resp.status;
      try { detail = (await resp.json()).detail || detail; } catch (e) {}
      throw new Error("服务返回 " + detail);
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      let idx;
      while ((idx = buffer.indexOf("\n\n")) >= 0) {
        const chunk = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        for (const line of chunk.split("\n")) {
          if (line.startsWith("data:")) {
            try { handleEvent(JSON.parse(line.slice(5).trim())); } catch (e) {}
          }
        }
      }
    }
  } catch (e) {
    if (e.name !== "AbortError") {
      const el = document.createElement("div");
      el.className = "flag";
      el.textContent = "请求失败：" + e.message;
      $("flags").appendChild(el);
    }
  } finally {
    finish();
  }
}

/* ---------- 初始化 ---------- */
async function init() {
  try {
    const r = await fetch("./api/voices");
    const data = await r.json();
    const sel = $("voice");
    (data.voices || []).forEach(v => {
      const o = document.createElement("option");
      o.value = v.id; o.textContent = v.name;
      sel.appendChild(o);
    });
    sel.value = localStorage.getItem("debate_voice") || data.default;
    $("rate").value = localStorage.getItem("debate_rate") || data.rate || "+8%";
    $("voice").onchange = () => localStorage.setItem("debate_voice", $("voice").value);
    $("rate").onchange = () => localStorage.setItem("debate_rate", $("rate").value);
  } catch (e) {}
  try {
    const r = await fetch("./healthz");
    const d = await r.json();
    const s = d.engine && d.engine.strong;
    $("engineTag").textContent = s && s.key_set
      ? `引擎就绪：${s.model}` : "引擎未配置密钥";
  } catch (e) { $("engineTag").textContent = "引擎不可达"; }
  $("token").value = localStorage.getItem("debate_token") || "";
  $("useToken").checked = !!$("token").value;
  $("token").onchange = () => localStorage.setItem("debate_token", $("token").value);
  // 出稿模型下拉（含 Claude 等，按分组展示）
  try {
    const r = await fetch("./api/models");
    const d = await r.json();
    const sel = $("genModel"); sel.innerHTML = "";
    let last = null, og = null;
    (d.models || []).forEach(m => {
      const g = m.group || "";
      if (g && g !== last) { og = document.createElement("optgroup"); og.label = g; sel.appendChild(og); last = g; }
      const o = document.createElement("option");
      o.value = m.id || ""; o.textContent = (m.name || m.id || "默认") + (m.ready === false ? "（未配置）" : "");
      o.disabled = (m.ready === false);
      (og || sel).appendChild(o);
    });
    sel.value = localStorage.getItem("debate_genmodel") || "";
    sel.onchange = () => localStorage.setItem("debate_genmodel", sel.value);
  } catch (e) {}
}

$("runBtn").onclick = run;
$("stopBtn").onclick = stopSpeak;
init();
</script>
</body>
</html>
